services:
  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    env_file: ../../.env
    ports:
      - "3000:3000"
    depends_on:
      - api
      - keycloak

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    env_file: ../../.env
    environment:
      MCP_INTERNAL_URL: http://mcp:8090
      CATALOG_DATABASE_URL: postgres://nexo:nexo@catalog-db:5432/nexo_catalog
    depends_on:
      - mcp
      - otel-collector
      - keycloak

  mcp:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.mcp
    env_file: ../../.env
    environment:
      PORT: 8090
      CATALOG_DATABASE_URL: postgres://nexo:nexo@catalog-db:5432/nexo_catalog
    depends_on:
      - otel-collector
      - catalog-db

  catalog-db:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: nexo_catalog
      POSTGRES_USER: nexo
      POSTGRES_PASSWORD: nexo
    volumes:
      - catalog-db:/var/lib/postgresql/data

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - elasticsearch

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HOSTNAME: http://localhost:3000/auth
      KC_PROXY_HEADERS: xforwarded
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak/realm-nexo.json:/opt/keycloak/data/import/realm-nexo.json:ro
    depends_on:
      - keycloak-db

  keycloak-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - keycloak-db:/var/lib/postgresql/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms2g -Xmx2g
    volumes:
      - elasticsearch:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.0
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      - elasticsearch

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "3001:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - elasticsearch

volumes:
  catalog-db:
  keycloak-db:
  elasticsearch:
